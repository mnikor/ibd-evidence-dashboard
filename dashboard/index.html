<style>
:root {
  --fs: 1.12; --fs-chart: 1.06; --lh: 1.45; --pad: 18px; --cell: 9px;
  color-scheme: light;
  --bg: #f6f5f3; --surface: #ffffff; --surface-2: #faf9f7; --line: #e7e5e1; --line-strong: #d4d1cb;
  --text: #1a1a1a; --text-2: #55534e; --text-3: #8a8780;
  --accent: #eb1700; --accent-ink: #c41400; --accent-soft: #fdebe8;
  --tre: #eb1700; --ico: #2a78d6; --jnj4804: #1baf7a; --comp: #a3a29c;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --sim: #e8760a; --sim-soft: #fff1e3; --der: #2c7d94; --unv: #b08800; --man: #0e9f6e; --ai: #8a4fd6;
  --seq-0: #eef4fc; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --shadow: 0 1px 2px rgba(20,20,20,.04), 0 4px 16px rgba(20,20,20,.05);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #21211f; --line: #2e2e2b; --line-strong: #3d3d39;
    --text: #f4f3f0; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #f0442a; --accent-ink: #ff6a52; --accent-soft: #3a1c17;
    --tre: #f0442a; --ico: #3987e5; --jnj4804: #199e70; --comp: #6b6a65;
    --sim: #f39a4a; --sim-soft: #3a2a1a; --der: #62b6cc; --unv: #d9b640; --man: #34d399; --ai: #b490f2;
    --seq-0: #1e2632; --seq-1: #1c3350; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #21211f; --line: #2e2e2b; --line-strong: #3d3d39;
  --text: #f4f3f0; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #f0442a; --accent-ink: #ff6a52; --accent-soft: #3a1c17;
  --tre: #f0442a; --ico: #3987e5; --jnj4804: #199e70; --comp: #6b6a65;
  --sim: #f39a4a; --sim-soft: #3a2a1a; --der: #62b6cc; --unv: #d9b640; --man: #34d399; --ai: #b490f2;
  --seq-0: #1e2632; --seq-1: #1c3350; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: calc(14px * var(--fs))/var(--lh) Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
.app { display: grid; grid-template-columns: min(300px, calc(232px * var(--fs))) 1fr; min-height: 100vh; }
/* sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: calc(13px * var(--fs)); letter-spacing: -.02em; }
.brand-name { font-weight: 700; font-size: calc(15px * var(--fs)); letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: calc(11.5px * var(--fs)); color: var(--text-3); }
.nav-btn { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-weight: 500; }
.nav-btn svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav-count { margin-left: auto; font-size: calc(11px * var(--fs)); background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 7px; font-weight: 600; }
.side-foot { margin-top: auto; font-size: calc(11.5px * var(--fs)); color: var(--text-3); padding: 10px 8px 0; border-top: 1px solid var(--line); }
/* top bar */
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: calc(19px * var(--fs)); margin: 0; letter-spacing: -.015em; font-weight: 700; }
.top .asof { color: var(--text-3); font-size: calc(12.5px * var(--fs)); }
.spacer { flex: 1; }
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: calc(12.5px * var(--fs)); font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button.on { background: var(--text); color: var(--surface); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: calc(12.5px * var(--fs)); color: var(--text-2); cursor: pointer; user-select: none; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; }
.toggle input { accent-color: var(--sim); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 8px; cursor: pointer; display: inline-grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--text-2); fill: none; stroke-width: 1.8; }
.content { padding: 22px 28px 60px; max-width: 1480px; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--sim-soft); border: 1px solid color-mix(in srgb, var(--sim) 35%, transparent); color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: calc(12.5px * var(--fs)); margin-bottom: 18px; }
.banner b { color: var(--sim); }
/* layout primitives */
.grid { display: grid; gap: 16px; }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s-3 { grid-column: span 3; } .s-4 { grid-column: span 4; } .s-5 { grid-column: span 5; } .s-6 { grid-column: span 6; } .s-7 { grid-column: span 7; } .s-8 { grid-column: span 8; } .s-12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: var(--pad) var(--pad) calc(var(--pad) - 2px); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: calc(14.5px * var(--fs)); margin: 0; font-weight: 650; letter-spacing: -.005em; }
.card-h .sub { color: var(--text-3); font-size: calc(12.5px * var(--fs)); }
.card-h .right { margin-left: auto; }
.section-title { font-size: calc(12px * var(--fs)); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; margin: 26px 0 10px; }
/* KPI tiles */
.kpi { padding: 16px 18px; }
.kpi .lbl { font-size: calc(12px * var(--fs)); color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: calc(30px * var(--fs)); font-weight: 700; letter-spacing: -.03em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: calc(15px * var(--fs)); color: var(--text-3); font-weight: 500; letter-spacing: 0; }
.kpi .foot { font-size: calc(12px * var(--fs)); color: var(--text-3); overflow-wrap: anywhere; }
.kpi .foot .chip { max-width: 100%; white-space: normal; }
.btns { flex-wrap: wrap; }
.lever select { max-width: 100%; min-width: 0; }
.hta-tbl td { white-space: normal; }
.grid > * { min-width: 0; }
html, body { overflow-x: clip; }
.hta-tbl td:first-child { white-space: normal; }
.kpi.hot { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
/* AI blocks */
.ai { position: relative; background: linear-gradient(135deg, var(--accent-soft), var(--surface) 60%); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); }
.ai-tag { display: inline-flex; align-items: center; gap: 6px; font-size: calc(11px * var(--fs)); font-weight: 600; color: var(--accent-ink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); padding: 2px 8px; border-radius: 20px; letter-spacing: .02em; }
.ai-tag svg { width: 12px; height: 12px; fill: var(--accent); }
.ai ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.ai li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: calc(13.5px * var(--fs)); }
.ai li .n { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--surface); font-size: calc(11px * var(--fs)); font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.explain { font-size: calc(13px * var(--fs)); color: var(--text-2); background: var(--surface-2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 8px 8px 0; margin-bottom: 14px; }
.explain b { color: var(--text); }
/* actions */
.act { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: start; transition: border-color .15s; }
.act + .act { margin-top: 10px; }
.act:hover { border-color: var(--line-strong); }
.act .score { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: calc(15px * var(--fs)); background: var(--accent-soft); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.act .score small { display: block; font-size: calc(9px * var(--fs)); font-weight: 600; letter-spacing: .04em; color: var(--text-3); margin-top: -6px; }
.act .t { font-weight: 600; font-size: calc(13.5px * var(--fs)); }
.act .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.act .why { margin-top: 8px; font-size: calc(12.5px * var(--fs)); color: var(--text-2); display: none; }
.act.open .why { display: block; }
.act .why ul { margin: 4px 0 8px; padding-left: 18px; }
.act .btns { display: flex; gap: 6px; }
.act.accepted { opacity: .6; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: calc(12px * var(--fs)); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
/* 25 filled red buttons made every card shout; Accept is outlined until chosen */
.btn.accept { border-color: var(--accent); color: var(--accent-ink); background: transparent; }
.btn.accept:hover { background: var(--accent-soft); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: calc(11.5px * var(--fs)); padding: 2px 8px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.chip.link { cursor: pointer; }
.chip.link:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.lvl-s { background: var(--text); color: var(--surface); border-color: var(--text); }
.chip.sim { color: var(--sim); border-color: color-mix(in srgb, var(--sim) 40%, transparent); background: var(--sim-soft); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12px * var(--fs)); font-weight: 600; }
.status i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: calc(10px * var(--fs)); color: #fff; }
.st-green i { background: var(--good); } .st-amber i { background: var(--warning); color: #1a1a1a; } .st-red i { background: var(--critical); } .st-grey i { background: var(--text-3); }
/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: calc(12.8px * var(--fs)); }
.tbl th { text-align: left; font-weight: 600; color: var(--text-3); font-size: calc(11.5px * var(--fs)); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); cursor: pointer; white-space: nowrap; }
.tbl td { padding: var(--cell) 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl td:first-child { white-space: nowrap; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { max-height: 440px; overflow: auto; }
/* long tables flow with the page instead of trapping the mouse wheel in a nested scroll box */
.scroll-x { overflow-x: auto; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nw { white-space: nowrap; }
.vchip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: calc(12px * var(--fs)); font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); }
.vchip.unk { border-style: dashed; color: var(--text-2); } .vchip.soft { color: var(--text-2); font-weight: 500; }
.vchip.tre { border-color: color-mix(in srgb, var(--tre) 55%, var(--line)); } .vchip.sky { border-color: var(--text-3); }
.pf-grp td { background: var(--surface-2); font-weight: 700; font-size: calc(11px * var(--fs)); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.pf-was { text-decoration: line-through; color: var(--text-3); font-size: calc(11px * var(--fs)); }
.rb-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin: 0 4px 0 8px; border: 1px solid var(--line); }
.tbl.tight th, .tbl.tight td { padding-left: 6px; padding-right: 6px; }
.tbl.tight th.num { width: 96px; font-size: calc(10px * var(--fs)); line-height: 1.2; }
.bar-mini { height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; min-width: 70px; }
.bar-mini > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
/* simplified version */
body.clean .provs, body.clean .pv-bar, body.clean .ibtn, body.clean .prov-legend, body.clean .tester-only { display: none !important; }
body.simple .chip { white-space: normal; max-width: 100%; text-align: left; }
.sx-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 16px; border-bottom: 1px solid var(--line); }
.sx-tabs button { border: 0; background: none; padding: 9px 14px; font: inherit; font-size: calc(13.5px * var(--fs)); font-weight: 600; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.sx-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.sx-tabs button:hover { color: var(--text); }
.sx-sum { margin-bottom: 16px; }
.sx-sum .sx-q { font-size: calc(15px * var(--fs)); font-weight: 600; margin: -4px 0 8px; }
.sx-sum ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: calc(13.5px * var(--fs)); line-height: 1.5; }
.sx-how { margin-top: 10px; font-size: calc(12.5px * var(--fs)); color: var(--text-2); }
.sx-how summary, .sx-more > summary { cursor: pointer; color: var(--text-2); font-weight: 600; }
.sx-how > div { margin-top: 6px; }
.sx-more { margin-top: 4px; }
.sx-more > summary { list-style: none; padding: 12px 16px; border: 1px dashed var(--line-strong); border-radius: 12px; text-align: center; font-size: calc(13px * var(--fs)); background: var(--surface); }
.sx-more > summary::-webkit-details-marker { display: none; }
.sx-more[open] > summary { margin-bottom: 16px; }
.sx-qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sx-qbtn { display: grid; grid-template-columns: 22px 1fr 14px; gap: 8px; align-items: start; text-align: left; font: inherit; font-size: calc(13px * var(--fs)); padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); cursor: pointer; }
.sx-qbtn:hover { border-color: var(--accent); }
.sx-qbtn .n { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--surface); font-size: calc(11px * var(--fs)); font-weight: 700; display: grid; place-items: center; }
.sx-qbtn i { font-style: normal; color: var(--text-3); }
.sx-alt { color: var(--accent-ink, var(--text)); font-weight: 600; text-decoration: none; }
[data-code] { border-bottom: 1px dotted var(--line-strong); }
/* guideline positions */
.gp-tbl td.gp-cell { vertical-align: top; cursor: help; min-width: 84px; white-space: normal; }
.gp-tbl th { white-space: normal; }
.gp-tbl th.gp-tre { color: var(--tre); }
.gp { display: inline-block; font-size: calc(11px * var(--fs)); font-weight: 600; padding: 2px 7px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.gp-strong { background: var(--text); color: var(--surface); }
.gp-cond { border-color: var(--text-2); color: var(--text); }
.gp-neg { border-color: var(--critical); color: var(--critical); }
.gp-none { color: var(--text-3); border: 1px dashed var(--line-strong); }
.gp-na { color: var(--text-3); }
.gp-alert { border: 1px dashed var(--critical); color: var(--critical); }
.gp-tag { font-size: calc(10.5px * var(--fs)); color: var(--text-2); margin-top: 3px; line-height: 1.25; }
/* provenance */
.pv { display: inline-flex; align-items: center; gap: 4px; font-size: calc(10.5px * var(--fs)); font-weight: 600; letter-spacing: .02em; line-height: 1; padding: 3px 7px; border-radius: 20px; white-space: nowrap; cursor: help;
  color: var(--pvc); background: color-mix(in srgb, var(--pvc) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pvc) 30%, transparent); }
.pv i { font-style: normal; font-size: 1.05em; }
.pv-fact { --pvc: var(--text-2); } .pv-calc { --pvc: var(--der); } .pv-ai { --pvc: var(--ai); } .pv-sim { --pvc: var(--sim); }
.provs { display: inline-flex; gap: 4px; flex-wrap: wrap; align-self: center; }
.card.kpi { position: relative; }
.provs.corner { position: absolute; top: 10px; right: 10px; }
.provs.corner .pv { padding: 3px 5px; } .provs.corner .pv span { display: none; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: calc(12px * var(--fs)); color: var(--text-2); margin: -4px 0 14px; }
.pv-bar .pv { cursor: help; }
.pv-bar .pv-d { color: var(--text-3); }
body.prov .is-ai { text-decoration: underline dotted var(--ai) 2px; text-underline-offset: 3px; }
body.prov .is-man { text-decoration: underline dotted var(--man) 2px; text-underline-offset: 3px; }
body.prov :is(.is-sim, .is-der, .is-ai, .is-unv, .is-man) { cursor: help; }
body.prov .is-sim { text-decoration: underline dotted var(--sim) 2px; text-underline-offset: 3px; }
body.prov .is-der { text-decoration: underline dotted var(--der) 2px; text-underline-offset: 3px; }
body.prov .is-unv { text-decoration: underline dotted var(--unv) 2px; text-underline-offset: 3px; }
body.prov .sim-card { outline: 2px dashed color-mix(in srgb, var(--sim) 60%, transparent); outline-offset: 2px; }
.prov-legend { display: none; gap: 14px; font-size: calc(12px * var(--fs)); color: var(--text-2); margin-bottom: 14px; flex-wrap: wrap; }

<body>
<div class="app">
  <aside class="side" id="nav">
    <div class="brand"><div class="brand-mark">IBD</div><div><div class="brand-name">Evidence<br>Intelligence</div><div class="brand-sub">Tremfya · Icotrokinra</div></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="view-title">Command Center</h1><div class="asof">Data as of 19 Sep 2026 · registry + public sources + simulated inputs</div></div>
      <div class="spacer"></div>
      <div class="seg" id="f-brand"></div>
      <div class="seg" id="f-ind"></div>

<script>
"use strict";
const D = window.IBD;
// ---- manual edits (Data Editor): applied on load so saved corrections show immediately, even before a rebuild
let EDIT_API = location.protocol.startsWith("http");  // confirmed by probing the edit API below
function applyOverrides(ops) {
  let changed = 0;
  for (const o of ops) {
    const rows = D[o.table];
    if (!Array.isArray(rows)) continue;
    if (o.op === "add") {
      if (!rows.some(r => r._key === o.key)) { rows.push({ ...(o.row || {}), _key: o.key, _o: "manual", _man: Object.keys(o.row || {}).filter(k => !k.startsWith("_")), _sim: [], _der: [], _unv: [], _src: ["SRC-MANUAL"] }); changed++; }
      continue;
    }
    const i = rows.findIndex(r => r._key === o.key);
    if (i < 0) continue;
    if (o.op === "delete") { rows.splice(i, 1); changed++; continue; }
    const r = rows[i];
    if (JSON.stringify(r[o.field]) !== JSON.stringify(o.new)) changed++;
    r[o.field] = o.new;
    r._man = [...new Set([...(r._man || []), o.field])];
    for (const k of ["_sim", "_der", "_unv"]) r[k] = (r[k] || []).filter(f => f !== o.field);
  }
  return changed;
}
const PENDING_REBUILD = applyOverrides(window.IBD_OVR || []);
const TODAY = new Date(2026, 8, 19);
const JNJ = ["TRE", "ICO", "JNJ4804"];
const BRAND_LABEL = { TRE: "TREMFYA", ICO: "Icotrokinra", JNJ4804: "JNJ-4804" };
const state = { view: "command", brand: "ALL", ind: "ALL", prov: false };
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem("ibd-decisions") || "{}"); } catch (e) { decisions = {}; }
const saveDecisions = () => { try { localStorage.setItem("ibd-decisions", JSON.stringify(decisions)); } catch (e) {} };

// ------------------------------------------------------------------ indexes
const by = (arr, k) => Object.fromEntries(arr.map(r => [r[k], r]));
const SIMPLE = !!window.IBD_SIMPLE;  // simplified version (dashboard/simple.html)
const IX = {
  brand: by(D.brands, "brand_id"), gap: by(D.evidence_gaps, "gap_id"), si: by(D.strategic_imperatives, "imperative_id"),
  kq: by(D.key_questions, "kq_id"), study: by(D.studies, "study_id"), cst: by(D.competitor_studies, "study_id"),
  ev: by(D.competitive_events, "event_id"), out: by(D.evidence_outputs, "output_id"), venue: by(D.venues, "venue_id"),
  src: by(D.sources, "source_id"), funder: by(D.funders, "funder_id"), seg: by(D.care_segments, "segment_id"),
  design: by(D.study_design, "study_id"), strat: by(D.competitor_strategies, "brand_id"), imp: by(D.competitive_impact, "impact_id"),
  loe: by(D.loe || [], "loe_id"),
};
const msByStudy = d3.group(D.study_milestones, m => m.study_id);
const fundByStudy = d3.group(D.study_funding, f => f.study_id);
const outByStudy = d3.group(D.evidence_outputs, o => o.study_id);
const resByStudy = d3.group(D.study_results, r => r.study_id);
const pubById = Object.fromEntries((D.publications || []).map(p => [p.pub_id, p]));
const pubsOfStudy = sid => (D.publications || []).filter(p => (p.linked_study_ids || "").split("; ").includes(sid));
const pubsOfGap = gid => ((IX.gap[gid]?.linked_pub_ids || "").split("; ").filter(Boolean)).map(id => pubById[id]).filter(Boolean);
const siOfGap = g => IX.kq[g.kq_id] ? IX.kq[g.kq_id].imperative_id : null;

// ------------------------------------------------------------------ helpers
function pd(s) {
  if (!s) return null;
  s = String(s);
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  if ((m = s.match(/^(\d{4})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, 15);
  if ((m = s.match(/^(\d{4})-Q(\d)$/))) return new Date(+m[1], (+m[2] - 1) * 3 + 1, 15);
  if ((m = s.match(/^(\d{4})-H(\d)$/))) return new Date(+m[1], m[2] === "1" ? 3 : 9, 1);
  if ((m = s.match(/^(\d{4})-mid$/))) return new Date(+m[1], 5, 30);
  if ((m = s.match(/^(\d{4})$/))) return new Date(+m[1], 6, 1);
  return null;
}
const CF = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs-chart")) || 1;  // chart label scale
const monthsFrom = (d, base = TODAY) => d ? (d - base) / (1000 * 3600 * 24 * 30.44) : null;
const fmtD = d => d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }).replace(/ /g, "\u00a0") : "—";
const fmtM = d => d ? (d.getMonth() === 6 && d.getDate() === 1 ? String(d.getFullYear()) : d.toLocaleDateString("en-GB", { month: "short", year: "numeric" }).replace(/ /g, "\u00a0")) : "—";
// registry-style strings ("2026-04-27", "2026-09", "2026-Q4") shown in one readable format
const fmtAny = v => { const t = String(v || ""); if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return fmtD(pd(t)); if (/^\d{4}-\d{2}$/.test(t)) return fmtM(pd(t));
  const q = t.match(/^(\d{4})-?(Q[1-4])$/); return q ? `${q[2]}\u00a0${q[1]}` : esc(t); };
const fmtUSD = v => v == null ? "—" : v >= 1e9 ? `$${(v / 1e9).toFixed(2)}B` : v >= 1e6 ? `$${(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `$${Math.round(v / 1e3)}K` : `$${v}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (row, f) => !row ? "" : (row._man || []).includes(f) ? "is-man" : (row._sim || []).includes(f) ? "is-sim" : (row._ai || []).includes(f) ? "is-ai" : (row._der || []).includes(f) ? "is-der" : (row._unv || []).includes(f) ? "is-unv" : "";
const V = (row, f, text) => `<span class="${cls(row, f)}">${text ?? esc(row[f] ?? "—")}</span>`;
const brandColor = b => `var(--${({ TRE: "tre", ICO: "ico", JNJ4804: "jnj4804" })[b] || "comp"})`;
const firstBrand = s => String(s || "").split(";")[0].trim();
const bdot = b => `<span class="dot" style="background:${brandColor(b)}"></span>`;
const statusBadge = rag => {
  const m = { green: ["st-green", "✓", "On track"], amber: ["st-amber", "!", "At risk"], red: ["st-red", "✕", "Off track"] }[rag] || ["st-grey", "–", "No data"];
  return `<span class="status ${m[0]}"><i>${m[1]}</i>${m[2]}</span>`;
};
const simChip = (label = "simulated") => `<span class="chip sim">${label}</span>`;
function entityLabel(id) {
  if (SIMPLE && (IX.gap[id] || IX.si[id] || IX.ev[id] || IX.out[id])) return sxName(id);
  if (IX.gap[id]) return id;
  if (IX.study[id]) return IX.study[id].acronym || id;
  if (IX.cst[id]) return IX.cst[id].acronym || id;
  if (IX.si[id]) return id;
  if (IX.ev[id]) return id;
  if (IX.out[id]) return id;
  return id;
}
const shortName = s => s.acronym || (s.title ? s.title.replace(/^(A |An )?(Study|Real-World Study|Prospective|Observational)( of| to| on| Study of)?\s*/i, "").slice(0, 22) + "…" : s.study_id);
const cite = id => `<span class="chip link" data-open="${esc(id)}">${esc(entityLabel(id))}</span>`;

// filters
function brandOk(ids) {
  if (state.brand === "ALL") return true;
  return String(ids || "").split(";").map(s => s.trim()).includes(state.brand);
}
function indOk(text) {
  if (state.ind === "ALL") return true;
  const t = String(text || "");
  return t.includes(state.ind) || t.includes("UC+CD") || t.includes("IBD");
}
const gapsF = () => D.evidence_gaps.filter(g => brandOk(g.brand_id) && indOk(g.care_segment_ids));
const siF = () => D.strategic_imperatives.filter(s => brandOk(s.brand_id) && (state.ind === "ALL" || s.indication_scope.includes(state.ind)));
const studiesF = () => D.studies.filter(s => brandOk(s.brand_ids) && indOk(s.indication));
const compF = () => D.competitor_studies.filter(s => indOk(s.indication));

// tooltip
const tip = document.getElementById("tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }

// ------------------------------------------------------------------ derived metrics
function nextMilestone(sid, codes) {
  const ms = (msByStudy.get(sid) || []).filter(m => codes.includes(m.code) && m.forecast_date && pd(m.forecast_date) >= TODAY);
  return ms.sort((a, b) => pd(a.forecast_date) - pd(b.forecast_date))[0];
}
function evidenceDebt() {
  const debt = [];
  for (const st of D.studies) {  // real publication record: congress data without a peer-reviewed trial paper
    if (!st.pubs_congress || st.peer_reviewed_paper || !/Janssen|Johnson/.test(st.lead_sponsor || "")) continue;
    const since = pd(st.first_congress_date);
    const planned = (outByStudy.get(st.study_id) || []).find(o => o.publication_type === "Primary manuscript" && o.status !== "published");
    debt.push({ sid: st.study_id, since, months: Math.round(-monthsFrom(since)), planned, study: st, real: true, n: st.pubs_congress });
  }
  for (const [sid, outs] of outByStudy) {
    if (!IX.study[sid]) continue;
    const pres = outs.filter(o => o.analysis_type === "Primary analysis" && o.status === "presented" && !/manuscript|Press/.test(o.publication_type));

    if (g.competitor_has_evidence) why.push(`Competitors already have evidence here${g.competitor_evidence_ref ? ` (${entityLabel(g.competitor_evidence_ref)})` : ""} — parity risk`);
    if (late) why.push(`Expected closure ${fmtM(exp)} is after the imperative's required date ${fmtM(req)}`);
    if (!exp) why.push("No expected closure date");

    acts.push({ id: "A-GAP-" + g.gap_id, level: "Strategic", kind: "Close gap", brand: g.brand_id,

      effect: `Raises coverage of ${g.gap_id}; lifts readiness of ${siOfGap(g)}`, owner, due: time, cost,

      why: [`${c.title}`, `Expected readout ${fmtM(r)} (${c.readout_confidence} confidence, ${c.pcd_date_type || "public"} date)`,
        lead != null ? `Lands ~${lead} months before J&J expects to close ${gid} (${fmtM(jc)})` : `J&J has no dated closure for ${gid}`],

      title: `Convert ${d.study.acronym || d.sid} ${d.topline ? "topline" : "congress data"} into a peer-reviewed manuscript`,

      impact: Math.min(5, s.impact_if_positive_1to5 + 1), urgency: 4, conf: 0.6, basis: "simulated enrollment curve" });

const ib = key => METHODS[key] ? `<button class="ibtn" data-method="${key}" aria-label="How this is calculated" title="How this is calculated">i</button>` : "";
function showMethod(btn) {
  const m = METHODS[btn.dataset.method]; if (!m) return;
  let pop = document.getElementById("method-pop");
  if (!pop) { pop = document.createElement("div"); pop.id = "method-pop"; pop.className = "ipop"; document.body.appendChild(pop); }
  const PROV = { "Simulated": "is-sim", "Public data, verified": "", };
  pop.innerHTML = `<div class="ipop-h"><b>${esc(m.t)}</b><button class="ipop-x" aria-label="Close">×</button></div>
    <dl><dt>What it shows</dt><dd>${esc(m.what)}</dd><dt>Source</dt><dd>${esc(m.src)}</dd><dt>How it's calculated</dt><dd>${esc(m.calc)}</dd><dt>Limits</dt><dd>${esc(m.lim)}</dd>
    <dt>Provenance</dt><dd>${btn.closest(".card")?.querySelector(".provs")?.outerHTML.replace(" corner", "") || ""} <span style="color:var(--text-2)">${esc(m.prov)}</span></dd></dl>`;
  pop.style.display = "block";
  const r = btn.getBoundingClientRect(), w = Math.min(460, innerWidth - 24);
  pop.style.width = w + "px";
  pop.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.left - 20)) + "px";
  const h = pop.offsetHeight, below = r.bottom + 8;
  pop.style.top = (below + h < innerHeight - 8 ? below : Math.max(8, r.top - h - 8)) + "px";
  pop.querySelector(".ipop-x").onclick = () => { pop.style.display = "none"; };
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-method]");
  if (b) { e.stopPropagation(); showMethod(b); return; }
  const pop = document.getElementById("method-pop");
  if (pop && pop.style.display === "block" && !e.target.closest("#method-pop")) pop.style.display = "none";
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") { const pop = document.getElementById("method-pop"); if (pop) pop.style.display = "none"; } });
addEventListener("scroll", () => { const pop = document.getElementById("method-pop"); if (pop) pop.style.display = "none"; }, { passive: true });

function drawRace(host) {
  const items = [];
  const inWin = d => d && d >= TODAY && monthsFrom(d) <= 30;
  for (const s of studiesF()) {
    if (!/Janssen|Johnson/.test(s.lead_sponsor)) continue;
    const key = s.evidence_class === "Interventional" || s.study_impact_score >= 1;
    if (!key) continue;
    const ms = msByStudy.get(s.study_id) || [];
    const hasTL = ms.some(x => x.code === "TLR" && x.forecast_date);
    for (const m of ms) {
      if (!["TLR", "PCD", "APP", "MS1"].includes(m.code) || (m.code === "PCD" && hasTL)) continue;
      const d = pd(m.forecast_date || m.actual_date);
      if (!inWin(d)) continue;
      items.push({ lane: 0, d, b: firstBrand(s.brand_ids), label: shortName(s), what: { TLR: "topline", PCD: "primary completion", APP: "approval", MS1: "paper" }[m.code], sub: s.title, id: s.study_id, sim: s._o === "simulated" });
    }
  }
  for (const c of compF()) {
    const d = pd(c.expected_readout);
    const pivotal = c.phase_registry.includes("Ph3") && !/pediatric|LTE/.test(c.study_type);
    if (!inWin(d) || !(pivotal || c.threatens_jnj_gap_id)) continue;
    items.push({ lane: 1, d, b: c.brand_id, label: `${IX.brand[c.brand_id]?.brand_name.split(" ")[0]} ${c.acronym || ""}`.trim(), what: "readout", sub: c.title, id: c.study_id, threat: !!c.threatens_jnj_gap_id });
  }
  for (const e of D.competitive_events) {
    const d = pd(e.date);
    if (!inWin(d) || JNJ.includes(e.brand_id)) continue;
    items.push({ lane: 1, d, b: e.brand_id, label: IX.brand[e.brand_id]?.brand_name.split(" ")[0], what: e.type, sub: e.description, id: e.event_id, threat: true, ai: e.date_certainty === "AI-predicted" });
  }
  const q0 = new Date(TODAY.getFullYear(), Math.floor(TODAY.getMonth() / 3) * 3, 1);
  const qs = d3.range(10).map(i => new Date(q0.getFullYear(), q0.getMonth() + i * 3, 1));
  const qOf = d => qs.findIndex((q, i) => d >= q && (i === qs.length - 1 || d < qs[i + 1]));
  const chip = it => `<div class="rchip" data-open="${esc(it.id)}" title="${esc(it.sub)}">
      <span class="${it.lane ? "rd" : "dot"}" style="background:${it.lane ? (it.threat ? "var(--text-2)" : "var(--comp)") : brandColor(it.b)}"></span>
      <span><b>${esc(it.label)}</b> <span class="rw">${esc(it.what)}${it.ai ? " · AI est." : ""}</span></span></div>`;
  host.innerHTML = `<div class="race" style="grid-template-columns:110px repeat(${qs.length},minmax(96px,1fr))">
    <div></div>${qs.map(q => `<div class="rq">Q${Math.floor(q.getMonth() / 3) + 1} ${q.getFullYear()}</div>`).join("")}
    <div class="rl">J&J evidence</div>${qs.map((q, i) => `<div class="rc">${items.filter(it => it.lane === 0 && qOf(it.d) === i).sort((a, b) => a.d - b.d).map(chip).join("")}</div>`).join("")}
    <div class="rl">Competitors</div>${qs.map((q, i) => `<div class="rc comp">${items.filter(it => it.lane === 1 && qOf(it.d) === i).sort((a, b) => a.d - b.d).map(chip).join("")}</div>`).join("")}
  </div><div style="font-size: calc(12px * var(--fs));color:var(--text-3);margin-top:8px">Dark diamond = threatens a J&J gap. “AI est.” = projected date. Click any item for detail.</div>`;
}

function drawGapMap(host, gaps) {
  const W = host.clientWidth || 700, H = 380, m = { l: Math.round(44 * CF()), r: 20, t: 14, b: 40 };
  const x = d3.scaleLinear().domain([-6, 106]).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([1.5, 5.7]).range([H - m.b, m.t]);
  const r = d3.scaleSqrt().domain([0, 48]).range([5, 18]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  svg.append("rect").attr("x", x(-6)).attr("y", y(5.7)).attr("width", x(50) - x(-6)).attr("height", y(3.8) - y(5.7)).attr("fill", "var(--accent-soft)").attr("rx", 8);
  svg.append("text").attr("x", x(-4)).attr("y", y(3.8) - 8).style("font-size", "calc(11px * var(--fs-chart))").style("font-weight", 600).style("fill", "var(--accent-ink)").text("ACT NOW · critical & under-covered");
  svg.append("text").attr("x", x(98)).attr("y", y(1.5) - 8).attr("text-anchor", "end").style("font-size", "calc(11px * var(--fs-chart))").style("fill", "var(--text-3)").text("lower priority · well covered");
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues([0, 25, 50, 75, 100]).tickFormat(d => d + "%"));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4));
  svg.append("text").attr("x", (W) / 2).attr("y", H - 6).attr("text-anchor", "middle").style("font-size", "calc(11px * var(--fs-chart))").text("Planned coverage (probability the gap closes)");
  svg.append("text").attr("transform", `translate(12,${H / 2}) rotate(-90)`).attr("text-anchor", "middle").style("font-size", "calc(11px * var(--fs-chart))").text("Gap criticality");
  const pts = gaps.map(g => ({ g, mo: Math.max(0, monthsFrom(pd(g.expected_close_date)) ?? 48) }));
  const node = svg.append("g").selectAll("g").data(pts.sort((a, b) => b.mo - a.mo)).join("g").style("cursor", "pointer")
    .on("click", (e, d) => openEntity(d.g.gap_id))
    .on("mousemove", (e, d) => showTip(e, `<b>${d.g.gap_id} · ${esc(d.g.title)}</b><br>Criticality ${d.g.gap_criticality_score.toFixed(1)} · coverage ${d.g.planned_coverage_pct}%<br>Closes ${fmtM(pd(d.g.expected_close_date))}${d.g.competitor_has_evidence ? "<br>⚠ competitor already has data" : ""}`))
    .on("mouseleave", hideTip);
  node.append("circle").attr("cx", d => x(d.g.planned_coverage_pct)).attr("cy", d => y(d.g.gap_criticality_score)).attr("r", d => r(Math.min(48, d.mo)))
    .attr("fill", d => brandColor(d.g.brand_id)).attr("fill-opacity", .78).attr("stroke", "var(--surface)").attr("stroke-width", 2);
  // label the gaps that matter (critical, under-covered) right next to their own bubble; try right, then
  // left, then small vertical nudges, and draw a leader line whenever the label had to move
  const lab = pts.filter(d => d.g.gap_criticality_score >= 4 && d.g.planned_coverage_pct < 60).sort((a, b) => a.g.planned_coverage_pct - b.g.planned_coverage_pct);
  const fs = 11 * CF(), lw = fs * 3.6, lh = fs + 3, boxes = [];
  const hit = (bx) => boxes.some(o => bx.x < o.x + o.w && bx.x + bx.w > o.x && bx.y < o.y + o.h && bx.y + bx.h > o.y)
    || pts.some(q => { const cx = x(q.g.planned_coverage_pct), cy = y(q.g.gap_criticality_score), rr = r(Math.min(48, q.mo));
      return cx + rr > bx.x && cx - rr < bx.x + bx.w && cy + rr > bx.y && cy - rr < bx.y + bx.h; });
  lab.forEach(d => {
    const cx = x(d.g.planned_coverage_pct), cy = y(d.g.gap_criticality_score), rr = r(Math.min(48, d.mo));
    const tries = [];
    for (const dy of [0, -lh, lh, -2 * lh, 2 * lh, -3 * lh, 3 * lh]) { tries.push({ x: cx + rr + 4, y: cy + dy - lh / 2, a: "start", dy }); tries.push({ x: cx - rr - 4 - lw, y: cy + dy - lh / 2, a: "end", dy }); }
    const pick = tries.find(t => t.x >= m.l && t.x + lw <= W - m.r && !hit({ x: t.x, y: t.y, w: lw, h: lh })) || tries[0];
    boxes.push({ x: pick.x, y: pick.y, w: lw, h: lh });
    Object.assign(d, { lx: pick.a === "start" ? pick.x : pick.x + lw, ly: pick.y + lh / 2, la: pick.a, moved: pick.dy !== 0, cx, cy, rr });
  });
  const lg = svg.append("g").style("pointer-events", "none");
  lab.filter(d => d.moved).forEach(d => lg.append("line").attr("x1", d.la === "start" ? d.cx + d.rr : d.cx - d.rr).attr("y1", d.cy).attr("x2", d.la === "start" ? d.lx - 2 : d.lx + 2).attr("y2", d.ly).attr("stroke", "var(--text-3)").attr("stroke-width", 1));
  lab.forEach(d => lg.append("text").attr("x", d.lx).attr("y", d.ly).attr("dy", "0.35em").attr("text-anchor", d.la).style("font-size", `${fs}px`).style("font-weight", 600).style("fill", "var(--text)")
    .style("paint-order", "stroke").style("stroke", "var(--surface)").style("stroke-width", 3).text(d.g.gap_id));
}

// generic sortable table
function table(rows, cols, idOf) {
  const id = "t" + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const t = document.getElementById(id);
    if (!t) return;
    t.querySelectorAll("th").forEach((th, i) => th.onclick = () => {
      const c = cols[i], key = c[3] || (r => String(c[1](r)).replace(/<[^>]+>/g, ""));
      const dir = th.dataset.dir === "asc" ? -1 : 1; th.dataset.dir = dir === 1 ? "asc" : "desc";
      rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * dir);
      t.querySelector("tbody").innerHTML = body();
    });
  });
  const body = () => rows.map(r => `<tr class="click" data-open="${esc(idOf(r))}">${cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("");
  return `<table class="tbl" id="${id}"><thead><tr>${cols.map(c => `<th class="${c[2] || ""}"${c[4] ? ` title="${esc(c[4])}"` : ""}>${c[0]}${c[4] ? ` <span style="color:var(--text-3)">ⓘ</span>` : ""}</th>`).join("")}</tr></thead><tbody>${body()}</tbody></table>`;
}

function drawGantt(host, rows) {

    ? `<button class="btn" id="gantt-toggle" style="margin-top:8px">${sState.compAll ? "Show only recent and upcoming competitor readouts" : `Show all ${compsAll.length} competitor Ph3 readouts (${compsAll.length - comps.length} older or later)`}</button>` : "";

  if (comps.length) {

    comps.sort((a, b) => pd(a.expected_readout) - pd(b.expected_readout)).forEach((c, i) => {
      const y = y0 + (i + 1) * rowH, d = pd(c.expected_readout), s0 = pd(c.start_date);

      g.append("text").attr("x", 4).attr("y", y + rowH / 2).attr("dy", "0.35em").style("font-size", "calc(11px * var(--fs-chart))").style("fill", "var(--text-2)").text(`${(IX.brand[c.brand_id]?.brand_name || c.brand_id).split(" (")[0]} · ${(c.acronym || c.study_id).slice(0, 20)}`);
      if (s0 && d) g.append("rect").attr("x", clampX(s0)).attr("y", y + 11).attr("width", Math.max(2, clampX(d) - clampX(s0))).attr("height", 4).attr("rx", 2).attr("fill", "var(--comp)");
      if (d) g.append("path").attr("d", d3.symbol(d3.symbolDiamond, 60)()).attr("transform", `translate(${clampX(d)},${y + 13})`).attr("fill", c.threatens_jnj_gap_id ? "var(--text-2)" : "var(--comp)");
      if (d && d > x.domain()[1]) g.append("text").attr("x", x.range()[1] - 10).attr("y", y + 13).attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "calc(10.5px * var(--fs-chart))").style("fill", "var(--text-3)").text(`→ ${d.getFullYear()}`);

async function drawMap(host, rows) {

  catch (e) { host.innerHTML = `<div class="empty">Could not load the world outline (offline?). The country table below has the same data.</div>`; return; }
  if (!host.isConnected) return; // view changed while the outline was loading

  const feats = topojson.feature(WORLD, WORLD.objects.countries).features.filter(f => f.properties.name !== "Antarctica");
  const proj = d3.geoNaturalEarth1().fitSize([W, H], { type: "FeatureCollection", features: feats });
  const path = d3.geoPath(proj);

  const val = r => !r ? null : wState.who === "jnj" ? r.jnj : wState.who === "comp" ? r.comp : r.jnj - r.comp;

    legendHtml = `<span><span class="dot" style="background:var(--critical)"></span>competitors far ahead</span><span><span class="dot" style="background:var(--serious)"></span>competitors ahead</span><span><span class="dot" style="background:var(--line)"></span>balanced / none</span><span><span class="dot" style="background:var(--seq-3)"></span>J&J ahead</span><span><span class="dot" style="background:var(--seq-5)"></span>J&J far ahead</span>`;

function ladder(sid) {
  const PUB_AN = { "Trial analysis (primary / secondary)": "Primary analysis", "Trial in progress / design": "Trial in progress", "Subgroup analysis": "Secondary analysis", "Pooled analysis": "Post-hoc analysis" };
  const real = pubsOfStudy(sid).map(p => ({ analysis_type: PUB_AN[p.analysis_type] || p.analysis_type, publication_type: p.kind === "journal" ? "Primary manuscript" : (/Oral/.test(p.presentation_type) ? "Oral presentation" : "Poster"),
    status: p.kind === "journal" ? "published" : "presented", title: p.title }));
  const outs = [...(outByStudy.get(sid) || []), ...real];
  const steps = [["Trial in progress", "TiP"], ["Baseline characteristics", "Baseline"], ["Interim analysis", "Interim (optional)"], ["Primary analysis|Press", "Topline"], ["Primary analysis|Oral|Late|Poster", "Primary congress"], ["Primary analysis|manuscript", "Primary paper"], ["Secondary analysis|Subgroup analysis", "Secondary"], ["Post-hoc analysis", "Post-hoc"], ["Long-term extension", "LTE"]];
  return `<div class="ladder">${steps.map(([k, lbl]) => {
    const [an, pubs] = k.split("|").length > 1 && !k.startsWith("Secondary") ? [k.split("|")[0], k.split("|").slice(1)] : [k, null];
    const match = outs.filter(o => (an.includes("|") ? an.split("|").includes(o.analysis_type) : o.analysis_type === an) && (!pubs || pubs.some(p => o.publication_type.includes(p))));
    const done = match.some(o => ["published", "presented"].includes(o.status)), plan = match.length && !done;
    const opt = lbl.includes("optional");
    return `<span class="${done ? "done" : plan ? "plan" : ""}${opt ? " opt" : ""}" title="${esc(match.map(o => o.title + " (" + o.status + ")").join("; ") || (opt ? "Optional: open-label, single-arm and extension studies, or a pre-specified interim made public. Blinded trials usually do not publish interim efficacy." : "not planned"))}">${lbl}</span>`;
  }).join("")}</div>`;
}

// Levers change study probabilities of success / dates and competitor event outcomes; the model recomputes
// gap coverage, criticality, expected closure, imperative readiness (ERI) and threat indices with the same
// formulas as the dataset build (scripts/build_dataset.py).
const COMP_LEVERS = [
  { id: "EV-101", label: "Skyrizi SC induction in CD", when: "FDA decision expected late 2026 (AbbVie guidance)", gaps: ["GAP-10"], impacts: ["IMP-01"], pos: "approved", neg: "rejected (CRL)" },

  { id: "EV-103", label: "Obefazimod FDA decision (UC)", when: "~Q4 2027", gaps: ["GAP-18", "GAP-21"], impacts: ["IMP-04"], pos: "approved", neg: "rejected" },
  { id: "EV-104", label: "Tulisokibart UC maintenance data", when: "~Dec 2026", gaps: ["GAP-18", "GAP-06"], impacts: ["IMP-03", "IMP-05"], pos: "strong maintenance", neg: "weak / safety issue" },
  { id: "EV-106", label: "Afimkibart AMETRINE Ph3 UC", when: "~Q2 2027", gaps: ["GAP-02"], impacts: ["IMP-06"], pos: "positive", neg: "negative" },
];
const JNJ_LEVERS = [
  { id: "CHARGE", label: "CHARGE: Tremfya vs Skyrizi (CD)", studies: ["NCT07499232"] },
  { id: "ICONIC-UC", label: "ICONIC-UC: icotrokinra Ph3 (UC)", studies: ["NCT07196748"] },
  { id: "ICONIC-CD", label: "ICONIC-CD: icotrokinra Ph2b/3 (CD)", studies: ["NCT07196722"] },
  { id: "REASON", label: "REASON: transmural healing (CD)", studies: ["NCT06408935"] },
  { id: "DUET", label: "DUET ENCORE-UC/CD: JNJ-4804 Ph3", studies: ["NCT07577856", "NCT07577843"] },
];
const FUND_LEVERS = ["SIM-ITC-02", "SIM-RWE-01", "SIM-DCE-01", "SIM-HEOR-02", "SIM-MECH-01"];
const baseScenario = () => ({ comp: {}, jnj: {}, fund: Object.fromEntries(FUND_LEVERS.map(f => [f, true])) });
const PRESETS = [
  { id: "EXP", name: "Expected", desc: "Every event at its probability-weighted expectation", sc: baseScenario() },
  { id: "SCN-01", name: "Base case", desc: "Skyrizi SC induction approved, REVAMP positive, obefazimod approved", sc: { ...baseScenario(), comp: { "EV-101": "pos", "EV-107": "pos", "EV-103": "pos" } } },
  { id: "SCN-02", name: "Skyrizi delayed", desc: "Skyrizi SC induction delayed 12 months; REVAMP positive", sc: { ...baseScenario(), comp: { "EV-101": "delay", "EV-107": "pos" } } },
  { id: "SCN-03", name: "Competitive squeeze", desc: "All competitor events positive; CHARGE enrollment slips 6 months", sc: { ...baseScenario(), comp: { "EV-101": "pos", "EV-107": "pos", "EV-104": "pos", "EV-103": "pos", "EV-106": "pos" }, jnj: { CHARGE: "delay6" } } },
  { id: "WIN", name: "J&J wins", desc: "CHARGE and ICONIC-UC positive; Skyrizi delayed; REVAMP not superior", sc: { ...baseScenario(), comp: { "EV-101": "delay", "EV-107": "neg" }, jnj: { CHARGE: "pos", "ICONIC-UC": "pos" } } },
  { id: "STRESS", name: "Stress test", desc: "CHARGE and ICONIC-UC fail; orphan-gap studies not funded", sc: { comp: {}, jnj: { CHARGE: "neg", "ICONIC-UC": "neg" }, fund: Object.fromEntries(FUND_LEVERS.map(f => [f, false])) } },
];
let scState;
try { scState = JSON.parse(localStorage.getItem("ibd-scenario") || "null"); } catch (e) { scState = null; }
if (!scState || !scState.sc) scState = { preset: "SCN-03", sc: JSON.parse(JSON.stringify(PRESETS[3].sc)) };
const saveSc = () => { try { localStorage.setItem("ibd-scenario", JSON.stringify(scState)); } catch (e) {} };
const addMonths = (d, m) => new Date(d.getFullYear(), d.getMonth() + m, d.getDate());

function modelRun(sc) {
  const studyPos = {}, studyDelay = {}, excluded = new Set();
  for (const L of JNJ_LEVERS) {
    const o = sc.jnj[L.id];
    for (const sid of L.studies) {
      if (o === "pos") studyPos[sid] = 1;
      if (o === "neg") studyPos[sid] = 0;
      if (o === "delay6") studyDelay[sid] = 6;
      if (o === "delay12") studyDelay[sid] = 12;
    }
  }
  for (const f of FUND_LEVERS) if (sc.fund[f] === false) excluded.add(f);
  const gapAdj = {};
  for (const L of COMP_LEVERS) {
    const o = sc.comp[L.id];
    const ev = IX.ev[L.id], evDate = pd(ev?.date), p = ev?.probability_positive ?? 0.5;
    for (const g of L.gaps) {
      const a = gapAdj[g] || (gapAdj[g] = { urg: 0, comp: false, deadlines: [] });
      if (o === "pos") { a.urg += 1; a.comp = true; }
      if (o === "neg" || o === "delay") a.urg -= 1;
      // a positive competitor readout sets a deadline: J&J evidence landing later loses value
      if (evDate && o !== "neg") a.deadlines.push({ d: addMonths(evDate, 6 + (o === "delay" ? 12 : 0)), w: o === "pos" || o === "delay" ? 1 : p });
    }
  }
  const gaps = {};
  for (const g0 of D.evidence_gaps) {
    const a = gapAdj[g0.gap_id] || { urg: 0, comp: false, deadlines: [] };
    const urg = Math.max(1, Math.min(5, g0.urgency + a.urg));
    const compHas = g0.competitor_has_evidence || a.comp;
    const gcs = Math.min(5, 0.25 * g0.stakeholder_importance + 0.25 * g0.imperative_alignment + 0.15 * g0.uncertainty_magnitude + 0.15 * g0.hta_guideline_relevance + 0.2 * urg + (compHas ? 1 : 0));
    let prod = 1, n = 0;
    const dates = [];
    for (const s of D.studies) {
      const fit = s.gap_fit?.[g0.gap_id];
      if (!fit || excluded.has(s.study_id)) continue;
      const pos = studyPos[s.study_id] ?? s.probability_of_success;
      n++;
      prod *= 1 - fit * pos;
      const pcd = pd(s.primary_completion_date);
      if (pcd && pos > 0) dates.push(addMonths(pcd, 6 + (studyDelay[s.study_id] || 0)));
    }
    dates.sort((x, y) => x - y);
    const fut = dates.filter(d => d >= TODAY);
    gaps[g0.gap_id] = { gcs, coverage: n ? (1 - prod) * 100 : 0, close: fut[0] || dates[dates.length - 1] || null, urg, compHas, deadlines: a.deadlines };
  }
  const eri = {}, parts = {};
  for (const si of D.strategic_imperatives) {
    let num = 0, den = 0;
    const ps = parts[si.imperative_id] = [];
    const req = pd(si.required_by_date);
    for (const g0 of D.evidence_gaps) {
      if (siOfGap(g0) !== si.imperative_id) continue;
      const g = gaps[g0.gap_id];
      const tlBy = dl => g.close ? (g.close <= dl ? 1 : Math.max(0, 1 - monthsFrom(g.close, dl) / 24)) : 0;
      let tl = tlBy(req);
      // landing after a competitor keeps parity value: late evidence retains 60% (+40% scaled by lateness)
      for (const dl of g.deadlines) if (dl.d < req) tl *= dl.w * (0.6 + 0.4 * tlBy(dl.d)) + (1 - dl.w);
      num += g.gcs * g.coverage / 100 * tl; den += g.gcs;
      ps.push({ gap_id: g0.gap_id, w: g.gcs, cov: g.coverage, tl, close: g.close, raw: g.gcs * g.coverage / 100 * tl });
    }
    for (const q of ps) { q.share = den ? q.w / den : 0; q.pts = den ? 100 * q.raw / den : 0; }  // pts over an imperative's gaps add up to its ERI
    eri[si.imperative_id] = den ? Math.round(100 * num / den) : null;
  }
  const threat = {};
  for (const im of D.competitive_impact) {
    const L = COMP_LEVERS.find(l => l.impacts.includes(im.impact_id));
    const o = L ? sc.comp[L.id] : null;
    const pBase = IX.ev[im.event_id]?.probability_positive ?? 1;
    let f = 1, t = im.time_to_impact_months;
    if (o === "pos") f = 1 / pBase;
    if (o === "neg") f = 0;
    if (o === "delay") { t += 12; f = (1 + im.time_to_impact_months / 12) / (1 + t / 12); }
    for (const gid of String(im.affected_gap_ids).split(";").map(x => x.trim())) {
      for (const Lj of JNJ_LEVERS) {
        if (!Lj.studies.some(sid => IX.study[sid]?.gap_fit?.[gid])) continue;
        if (sc.jnj[Lj.id] === "pos") f *= 0.7;
        if (sc.jnj[Lj.id] === "neg") f *= 1.3;
        if (String(sc.jnj[Lj.id] || "").startsWith("delay")) f *= 1.1;
      }
    }
    threat[im.impact_id] = Math.round(im.competitive_threat_index * f);
  }
  return { gaps, eri, threat, parts };
}

  el.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { const p = PRESETS.find(x => x.id === b.dataset.preset); scState = { preset: p.id, sc: JSON.parse(JSON.stringify(p.sc)) }; saveSc(); render(); });

    g.append("circle").attr("cx", x(c)).attr("cy", y).attr("r", 6).attr("fill", brandColor(s.brand_id)).attr("stroke", "var(--surface)").attr("stroke-width", 2);

      .style("fill", d < 0 ? "var(--critical)" : d > 0 ? "var(--good)" : "var(--text-3)").text(d ? `${d > 0 ? "+" : ""}${d}` : "0");
  });
  // gaps that move
  const moved = D.evidence_gaps.filter(g => brandOk(g.brand_id)).map(g => {
    const a = base.gaps[g.gap_id], b = cur.gaps[g.gap_id];
    const shift = a.close && b.close ? Math.round(monthsFrom(b.close, a.close)) : (a.close ? null : 0);

  const sgn = (v, bad) => v ? `<span style="color:${bad ? "var(--critical)" : "var(--good)"};font-weight:600">${v > 0 ? "+" : ""}${v}</span>` : `<span style="color:var(--text-3)">–</span>`;
  document.getElementById("sc-gaps").innerHTML = moved.length ? `<table class="tbl"><thead><tr><th>Gap</th><th>Title</th><th class="num">Coverage</th><th class="num">Δ</th><th class="num">Criticality Δ</th><th>Closes</th><th class="num">Shift (mo)</th></tr></thead><tbody>${moved.map(r => `
    <tr class="click" data-open="${r.g.gap_id}"><td><b>${r.g.gap_id}</b></td><td>${esc(r.g.title)}</td><td class="num">${Math.round(r.b.coverage)}%</td><td class="num">${sgn(r.dc, r.dc < 0)}</td><td class="num">${sgn(r.dg, r.dg > 0)}</td>
    <td>${r.b.close ? fmtM(r.b.close) : `<span style="color:var(--critical);font-weight:600">no closure</span>`}</td><td class="num">${r.shift == null ? "—" : sgn(r.shift, r.shift > 0)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No gap changes vs expected.</div>`;
  // robustness matrix
  const runs = PRESETS.map(p => ({ p, m: modelRun(p.sc) }));
  document.getElementById("rb-presets").innerHTML = runs.map(r => `<li><b>${esc(r.p.name)}</b>: ${esc(r.p.desc)}</li>`).join("");
  const cellBg = v => { const r = rag(v); return r === "red" ? "color-mix(in srgb, var(--critical) 22%, var(--surface))" : r === "amber" ? "color-mix(in srgb, var(--warning) 22%, var(--surface))" : "color-mix(in srgb, var(--good) 18%, var(--surface))"; };
  const dTxt = d => Math.abs(d) < 1 ? "" : `<small style="display:block;font-weight:400;color:var(--text-2)">${d > 0 ? "+" : "−"}${Math.abs(d)}</small>`;
  const verdictOf = vals => {
    const nRed = vals.filter(v => rag(v) === "red").length, nGreen = vals.filter(v => rag(v) === "green").length, spread = d3.max(vals) - d3.min(vals);
    if (nGreen === vals.length) return ["st-green", "✓", "Robust"];
    if (nRed === vals.length) return ["st-red", "✕", "Off track in all"];
    if (nRed === 0) return spread <= 3 ? ["st-amber", "!", "At risk in all"] : ["st-amber", "!", "Sensitive"];
    return ["st-red", "✕", "Fragile"];
  };
  const why = ([cls, , label], vals) => ({ "Robust": "on track in every scenario", "Off track in all": "off track in every scenario",
    "At risk in all": "at risk in every scenario and events barely move it: only new evidence helps", "Sensitive": `moves between ${d3.min(vals)} and ${d3.max(vals)} but never goes off track`,
    "Fragile": `goes off track in ${vals.filter(v => rag(v) === "red").length} of ${vals.length} scenarios` })[label];
  const E = runs[0].m;
  document.getElementById("robust").innerHTML = `<table class="tbl tight" style="width:100%"><thead><tr><th>Imperative</th><th>Verdict</th>${runs.map(r => `<th class="num" style="white-space:normal" title="${esc(r.p.desc)}">${esc(r.p.name)}</th>`).join("")}</tr></thead><tbody>${sis.filter(s => base.eri[s.imperative_id] != null).map(s => {
    const id = s.imperative_id, vals = runs.map(r => r.m.eri[id]), vd = verdictOf(vals), e0 = vals[0];
    const gapsOf = E.parts[id].slice().sort((a, b) => b.share - a.share);
    const detail = gapsOf.map(q => `<tr class="rb-detail" data-rb="${id}" style="display:none;font-size: calc(11.5px * var(--fs));background:var(--surface-2)">
      <td style="padding-left:18px;white-space:normal"><span class="chip link" data-open="${q.gap_id}">${q.gap_id}</span> ${esc(IX.gap[q.gap_id]?.title || "")}<div style="color:var(--text-3)">weight ${q.w.toFixed(1)} of 5 · ${Math.round(q.share * 100)}% of the imperative</div></td><td></td>
      ${runs.map(r => { const x = r.m.parts[id].find(z => z.gap_id === q.gap_id);
        return `<td class="num" title="${esc(r.p.name)}: coverage ${Math.round(x.cov)}% × on time ${Math.round(x.tl * 100)}%${x.close ? " (closes " + fmtM(x.close) + ")" : " (no closure date)"} × weight ${Math.round(x.share * 100)}% = ${x.pts.toFixed(1)} points">${x.pts.toFixed(0)}<small style="display:block;color:var(--text-3)">${Math.round(x.cov)}% · ${Math.round(x.tl * 100)}%</small></td>`; }).join("")}</tr>`).join("");
    return `<tr class="click rb-row" data-rbtoggle="${id}"><td style="white-space:normal;min-width:260px;max-width:420px"><span class="rb-caret" style="display:inline-block;width:12px;color:var(--text-3)">▸</span>${bdot(s.brand_id)} ${esc(s.title)}</td>
      <td class="nw" title="${esc(why(vd, vals))}"><span class="status ${vd[0]}"><i>${vd[1]}</i>${vd[2]}</span></td>
      ${vals.map((v, i) => `<td class="num" title="${esc(runs[i].p.name)}: readiness ${v}/100${i ? ` (${v - e0 >= 0 ? "+" : ""}${v - e0} vs Expected)` : ""}" style="background:${cellBg(v)};font-weight:600;border:2px solid var(--surface)">${v}${i ? dTxt(v - e0) : ""}</td>`).join("")}</tr>${detail}
      <tr class="rb-detail" data-rb="${id}" style="display:none"><td colspan="${runs.length + 2}" style="font-size: calc(11.5px * var(--fs));color:var(--text-3);background:var(--surface-2);padding-left:18px">Gap rows show points contributed to readiness in each scenario (they add up to the number above), with coverage · on-time underneath. <span class="chip link" data-open="${id}">Open imperative</span></td></tr>`; }).join("")}</tbody></table>`;
  document.querySelectorAll("#robust [data-rbtoggle]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("[data-open]")) return;
    const id = tr.dataset.rbtoggle, open = tr.classList.toggle("open");
    tr.querySelector(".rb-caret").textContent = open ? "▾" : "▸";
    document.querySelectorAll(`#robust [data-rb="${id}"]`).forEach(r => r.style.display = open ? "" : "none");
  });
  // narrative
  const items = [];
  const drops = rows.filter(s => cur.eri[s.imperative_id] < base.eri[s.imperative_id]);
  const worst = drops[0];
  if (worst) {
    const driver = D.evidence_gaps.filter(g => siOfGap(g) === worst.imperative_id).sort((p, q) => (cur.gaps[p.gap_id].coverage - base.gaps[p.gap_id].coverage) - (cur.gaps[q.gap_id].coverage - base.gaps[q.gap_id].coverage))[0];
    items.push(`<b>Biggest loser:</b> ${cite(worst.imperative_id)} “${esc(worst.title)}” falls ${base.eri[worst.imperative_id] - cur.eri[worst.imperative_id]} points to ${cur.eri[worst.imperative_id]}${driver ? `, driven by ${cite(driver.gap_id)} ${esc(driver.title)}` : ""}.`);
  }
  const newRed = sis.filter(s => rag(cur.eri[s.imperative_id]) === "red" && rag(base.eri[s.imperative_id]) !== "red");
  if (newRed.length) items.push(`<b>${newRed.length} imperative${newRed.length > 1 ? "s turn" : " turns"} red:</b> ${newRed.map(s => cite(s.imperative_id)).join(" ")}. These need a contingency evidence plan before the triggering event.`);
  const gains = rows.filter(s => cur.eri[s.imperative_id] > base.eri[s.imperative_id]).reverse();
  if (gains[0]) items.push(`<b>Biggest gain:</b> ${cite(gains[0].imperative_id)} rises ${cur.eri[gains[0].imperative_id] - base.eri[gains[0].imperative_id]} points. Plan how to amplify it in dissemination.`);
  const td = thr(cur) - thr(base);
  if (td) items.push(`<b>Competitive threat ${td > 0 ? "rises" : "falls"} by ${Math.abs(td)} points.</b> ${td > 0 ? "Largest single threat: " + (() => { const i = D.competitive_impact.slice().sort((p, q) => cur.threat[q.impact_id] - cur.threat[p.impact_id])[0]; return esc(IX.ev[i.event_id]?.description || i.event_id) + " " + cite(i.event_id); })() : "Time bought should go into closing the affected gaps."}`);
  const worsened = moved.filter(r => r.dc < 0 || r.dg > 0 || (r.shift || 0) > 0).slice(0, 3);
  if (worsened.length) items.push(`<b>Recommended moves:</b> ${worsened.map(r => `${cite(r.g.gap_id)} ${esc(routeFor(r.g)[0].charAt(0).toLowerCase() + routeFor(r.g)[0].slice(1))}`).join("; ")}.`);
  const failed = JNJ_LEVERS.filter(L => scState.sc.jnj[L.id] === "neg");
  if (failed.length) items.push(`<b>Contingency:</b> prepare negative-result communication and alternative evidence routes for ${failed.map(L => esc(L.label.split(":")[0])).join(", ")}.`);
  if (!items.length) items.push("This scenario matches the expected case: no material change.");
  document.getElementById("sc-narr").innerHTML = items.map((t, i) => `<li><span class="n">${i + 1}</span><span>${t}</span></li>`).join("");

// ---------- GUIDELINE POSITIONS: how each guideline places TREMFYA vs competitors (facts from the full texts)
const GP_DRUGS = ["TRE", "SKY", "OMV", "STE", "RIN", "ENT", "ZEP", "VEL"];
const GP_ORDER = ["ACG", "AGA", "ECCO", "BSG"];
const GP_POS = { recommended: ["Strong", "gp-strong"], suggested: ["Conditional", "gp-cond"], "not suggested": ["Not suggested", "gp-neg"], "not covered": ["Not covered", "gp-none"], "n/a": ["n/a", "gp-na"] };
const GP_TIER = { higher: "higher", intermediate: "intermediate", lower: "lower" };
function drawGuidelinePositions() {
  const host = document.getElementById("glpos"); if (!host || !(D.guideline_positions || []).length) return;
  const gls = D.guidelines.filter(g => indOk(g.indication)).slice().sort((a, b) => a.indication.localeCompare(b.indication) || GP_ORDER.findIndex(x => a.body.startsWith(x)) - GP_ORDER.findIndex(x => b.body.startsWith(x)));
  const P = (gid, b, setting) => D.guideline_positions.filter(p => p.guideline_id === gid && p.brand_id === b && (!setting || p.setting === setting));
  const nm = b => b === "TRE" ? "TREMFYA" : (IX.brand[b]?.brand_name || b);
  const cell = (g, b) => {
    const all = P(g.guideline_id, b), o = all.find(p => p.setting === "overall");
    if (!o) return `<td class="gp-cell"><span class="gp gp-none">Not covered</span></td>`;
    const [lbl, cls] = GP_POS[o.position] || [o.position, ""];
    const tags = [];
    const nv = all.find(p => p.setting === "naive"), pr = all.find(p => p.setting === "prior");
    if (nv) tags.push(`new to therapy: ${GP_TIER[nv.position]}`);
    if (pr) tags.push(`after therapy: ${GP_TIER[pr.position]}`);
    for (const p of all.filter(p => ["vs", "perianal", "route"].includes(p.setting))) tags.push(p.setting === "vs" ? "preferred over comparator" : p.setting === "perianal" ? "perianal fistula" : "SC induction");
    const tip = all.map(p => `${p.setting === "overall" ? "" : `<b>${esc({ naive: "New to advanced therapy", prior: "After advanced therapy", vs: "Head-to-head preference", perianal: "Perianal fistula", route: "Route" }[p.setting])}:</b> `}${esc(p.note)}`).join("<br>");
    return `<td class="gp-cell" data-gptip="${esc(`<b>${esc(nm(b))} · ${esc(g.body)} ${esc(g.indication)}</b><br>${tip}`)}"><span class="gp ${cls}${b === "TRE" && o.position === "not covered" ? " gp-alert" : ""}">${lbl}</span>${tags.map(t => `<div class="gp-tag">${esc(t)}</div>`).join("")}</td>`;
  };
  host.innerHTML = `<table class="tbl gp-tbl"><thead><tr><th>Guideline</th>${GP_DRUGS.map(b => `<th class="${b === "TRE" ? "gp-tre" : ""}">${esc(nm(b))}</th>`).join("")}</tr></thead><tbody>${gls.map(g => `<tr>
    <td class="nw"><b>${esc(g.body.replace(" (living)", ""))} ${esc(g.indication)}</b><div style="color:var(--text-3);font-size: calc(11px * var(--fs))">${fmtAny(g.version_date)}${/living/.test(g.body) ? " · living" : ""} ${srcLinks(g)}</div></td>
    ${GP_DRUGS.map(b => cell(g, b)).join("")}</tr>`).join("")}</tbody></table>
    <div class="legend" style="margin-top:8px"><span><span class="gp gp-strong">Strong</span> recommended</span><span><span class="gp gp-cond">Conditional</span> suggested</span><span><span class="gp gp-neg">Not suggested</span></span><span><span class="gp gp-none">Not covered</span> not named in a recommendation</span><span>Icotrokinra and JNJ-4804 are not approved in IBD and appear in no guideline.</span></div>`;
  host.querySelectorAll("[data-gptip]").forEach(td => { td.onmousemove = e => showTip(e, td.dataset.gptip); td.onmouseleave = hideTip; });
  // facts for J&J, computed from the positions
  const label = g => `${g.body.replace(" (living)", "")} ${g.indication} ${String(g.version_date).slice(0, 4)}`;
  const facts = [];
  const miss = gls.filter(g => (P(g.guideline_id, "TRE", "overall")[0]?.position || "not covered") === "not covered");
  const skyIn = miss.filter(g => ["recommended", "suggested"].includes(P(g.guideline_id, "SKY", "overall")[0]?.position));
  if (miss.length) facts.push(`<b>TREMFYA is not covered in ${miss.map(label).join(", ")}</b>${skyIn.length ? `; SKYRIZI is recommended or suggested in ${skyIn.length === miss.length ? "all of them" : skyIn.map(label).join(", ")}` : ""}.`);
  const inAll = gls.filter(g => ["recommended"].includes(P(g.guideline_id, "TRE", "overall")[0]?.position));
  if (inAll.length) facts.push(`TREMFYA has a strong recommendation in ${inAll.map(label).join(", ")}.`);
  const vs = D.guideline_positions.filter(p => p.setting === "vs" && gls.some(g => g.guideline_id === p.guideline_id));
  if (vs.length) { const by = {}; vs.forEach(p => { const k = `${nm(p.brand_id)} over ${p.note.match(/over ([a-z]+)/)?.[1] || "comparator"}`; (by[k] = by[k] || []).push(label(gls.find(g => g.guideline_id === p.guideline_id)) + (/SEQUENCE|VARSITY/.exec(p.note) ? ` (${/SEQUENCE|VARSITY/.exec(p.note)[0]})` : "")); });
    facts.push(`Head-to-head preferences: ${Object.entries(by).map(([k, v]) => `${esc(k)} in ${v.join(", ")}`).join("; ")}. None exists for TREMFYA; GALAXI's ustekinumab comparison has not become one.`); }
  const peri = D.guideline_positions.filter(p => p.setting === "perianal" && gls.some(g => g.guideline_id === p.guideline_id));
  if (peri.length) facts.push(`Perianal fistulas: ${[...new Set(peri.map(p => nm(p.brand_id)))].join(", ")} suggested (${label(gls.find(g => g.guideline_id === peri[0].guideline_id))}); no IL-23p19 drug is.`);
  const route = D.guideline_positions.filter(p => p.setting === "route" && p.brand_id === "TRE" && gls.some(g => g.guideline_id === p.guideline_id));
  if (route.length) facts.push(`Among the IL-23 drugs, subcutaneous induction is named only for TREMFYA, in ${route.map(p => label(gls.find(g => g.guideline_id === p.guideline_id))).join(" and ")}.`);

  document.getElementById("fgeo").innerHTML = `<div class="section-title" style="margin-top:0">Countries</div>${byGeo.map(([g, v]) => barRow(D.geographies.find(x => x.geo_id === g)?.name || g, v)).join("")}

    el.querySelectorAll("#f-theme button").forEach(b => b.classList.toggle("on", b.dataset.v === fState.theme));

        <span>${cite(f.mapped_gap_id)}</span></div>`).join("");
  };
  el.querySelectorAll("#f-theme button").forEach(b => b.onclick = () => { fState.theme = b.dataset.v; drawFeed(); });
  drawFeed();
};

// ---------- enrollment curve (study drawer)
function drawEnrollment(sid) {
  const host = document.getElementById("enr-chart");
  const rows = D.study_enrollment.filter(e => e.study_id === sid);
  if (!host || !rows.length) return;
  const W = host.clientWidth || 500, H = 200, m = { l: Math.round(44 * CF()), r: 84, t: 10, b: 26 };
  const pts = rows.map(r => ({ d: pd(r.period), a: r.patients_randomized_cum, p: r.patients_planned_cum, s: r.sites_activated, n: r.n_target }));
  const x = d3.scaleTime().domain(d3.extent(pts, p => p.d)).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, pts[0].n]).nice().range([H - m.b, m.t]);
  const svg = d3.select(host).append("svg").attr("width", W).attr("height", H);
  y.ticks(4).forEach(t => svg.append("line").attr("class", "grid-line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(t)).attr("y2", y(t)));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.timeFormat("%b %y")).tickSizeOuter(0));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(0)).call(g => g.select(".domain").remove());
  svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(pts[0].n)).attr("y2", y(pts[0].n)).attr("stroke", "var(--line-strong)");
  svg.append("text").attr("x", W - m.r + 6).attr("y", y(pts[0].n)).attr("dy", "0.35em").style("font-size", "calc(11px * var(--fs-chart))").text(`target ${pts[0].n}`);
  const col = brandColor(firstBrand(IX.study[sid].brand_ids));
  svg.append("path").attr("d", d3.line().x(p => x(p.d)).y(p => y(p.p))(pts)).attr("fill", "none").attr("stroke", "var(--text-3)").attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3");
  svg.append("path").attr("d", d3.line().x(p => x(p.d)).y(p => y(p.a))(pts)).attr("fill", "none").attr("stroke", col).attr("stroke-width", 2.2);
  const l = pts[pts.length - 1];
  let ya = y(l.a), yp = y(l.p);
  if (Math.abs(ya - yp) < 13) { const mid = (ya + yp) / 2, up = l.p >= l.a; yp = mid + (up ? -7 : 7); ya = mid + (up ? 7 : -7); }
  svg.append("text").attr("x", x(l.d) + 6).attr("y", ya).attr("dy", "0.35em").style("font-size", "calc(11px * var(--fs-chart))").style("font-weight", 600).style("fill", "var(--text)").text(`actual ${l.a}`);
  svg.append("text").attr("x", x(l.d) + 6).attr("y", yp).attr("dy", "0.35em").style("font-size", "calc(11px * var(--fs-chart))").style("fill", "var(--text-3)").text(`plan ${l.p}`);
  const cross = svg.append("line").attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "var(--line-strong)").style("opacity", 0);
  const dotA = svg.append("circle").attr("r", 4).attr("fill", col).attr("stroke", "var(--surface)").attr("stroke-width", 2).style("opacity", 0);
  svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", W - m.l - m.r).attr("height", H - m.t - m.b).attr("fill", "transparent")
    .on("mousemove", e => { const [mx] = d3.pointer(e); const d = x.invert(mx); const p = pts.reduce((a, b) => Math.abs(b.d - d) < Math.abs(a.d - d) ? b : a);
      cross.attr("x1", x(p.d)).attr("x2", x(p.d)).style("opacity", 1); dotA.attr("cx", x(p.d)).attr("cy", y(p.a)).style("opacity", 1);
      showTip(e, `<b>${fmtM(p.d)}</b><br>Randomized ${p.a} · plan ${p.p} (${Math.round(p.a / Math.max(1, p.p) * 100)}%)<br>Sites active ${p.s}<br><span class="muted">simulated curve · target N from registry</span>`); })
    .on("mouseleave", () => { cross.style("opacity", 0); dotA.style("opacity", 0); hideTip(); });
}

  // ---- industry symposia (UEGW)
  const sy = D.industry_symposia || [];

];
const edState = { table: "studies", q: "", page: 0, onlySim: false, tab: "edit" };
let edPending = [];
try { edPending = JSON.parse(localStorage.getItem("ibd-edit-drafts") || "[]"); } catch (e) { edPending = []; }
const saveDrafts = () => { try { localStorage.setItem("ibd-edit-drafts", JSON.stringify(edPending)); } catch (e) {} };
let edEditor = "";
try { edEditor = localStorage.getItem("ibd-editor-name") || ""; } catch (e) {}
const PAGE = 50;

function edColumns(rows) {
  const cols = [];
  for (const r of rows.slice(0, 200)) for (const k of Object.keys(r)) if (!k.startsWith("_") && !cols.includes(k)) cols.push(k);
  return cols;
}
const edShow = v => v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
function edPendingFor(table, key, field) { return edPending.find(p => p.op === "set" && p.table === table && p.key === key && p.field === field); }
function edCellClass(row, f) {
  if ((row._man || []).includes(f)) return "ed-man";
  if ((row._sim || []).includes(f)) return "ed-sim";
  if ((row._der || []).includes(f)) return "ed-der";
  if ((row._unv || []).includes(f)) return "ed-unv";
  return "";
}
function edParse(raw, old) {
  if (typeof old === "number") { const n = Number(raw); if (raw.trim() === "" ) return null; if (Number.isNaN(n)) throw new Error("Please enter a number"); return n; }
  if (typeof old === "boolean") return raw === "true";
  if (old && typeof old === "object") { try { return JSON.parse(raw); } catch (e) { throw new Error("Please enter valid JSON"); } }
  return raw;
}

function edEditCell(td, rowsAll) {
  if (td.querySelector(".ed-input")) return;
  const key = td.parentElement.dataset.key, f = td.dataset.f;
  const row = rowsAll.find(r => r._key === key);
  const pend = edPendingFor(edState.table, key, f);
  const cur = pend ? pend.new : row[f];
  const long = edShow(cur).length > 60 || (cur && typeof cur === "object");
  const derived = (row._der || []).includes(f);
  td.innerHTML = typeof cur === "boolean"
    ? `<select class="ed-input"><option ${cur ? "selected" : ""}>true</option><option ${!cur ? "selected" : ""}>false</option></select>`
    : long ? `<textarea class="ed-input" rows="4" style="width:100%;min-width:280px">${esc(edShow(cur))}</textarea>` : `<input class="ed-input" value="${esc(edShow(cur))}" style="width:100%;min-width:120px">`;
  const inp = td.querySelector(".ed-input");
  inp.focus(); if (inp.select) inp.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    let nv;
    try { nv = edParse(inp.value, row[f]); } catch (e) { alert(e.message); done = false; inp.focus(); return; }
    if (JSON.stringify(nv) === JSON.stringify(row[f])) { if (pend) edPending.splice(edPending.indexOf(pend), 1); }
    else {
      if (derived && !pend && !confirm(`"${f}" is a derived value. A manual value overrides the calculation (and is kept on rebuild). Continue?`)) { render(); return; }
      if (pend) pend.new = nv; else edPending.push({ op: "set", table: edState.table, key, field: f, old: row[f], new: nv });
    }
    saveDrafts(); render();
  };
  inp.onkeydown = e => { if (e.key === "Enter" && !(e.shiftKey || inp.tagName === "TEXTAREA")) commit(); if (e.key === "Escape") { done = true; render(); } if (e.key === "Enter" && e.metaKey) commit(); };
  inp.onblur = commit;
  inp.onclick = e => e.stopPropagation();
}

function edAddRow(cols) {

  const html = `<div class="kv" style="grid-template-columns:170px 1fr">${cols.map((c, i) => `<dt>${esc(c)}${i === 0 ? " *" : ""}</dt><dd><input class="ed-input ed-new" data-f="${esc(c)}" placeholder="${esc(typeof tpl[c] === "object" && tpl[c] ? "JSON" : typeof tpl[c])}" style="width:100%"></dd>`).join("")}</dl>

    <div style="font-size: calc(12px * var(--fs));color:var(--text-3);margin-top:8px">* The first field is the row key and must be unique. Leave other fields empty if unknown.</div>`;

function edRenderPending() {
  const host = document.getElementById("ed-pending");
  if (!host) return;
  if (!edPending.length) { host.style.display = "none"; return; }
  host.style.display = "";
  host.innerHTML = `<div class="card-h"><h2>${edPending.length} unsaved change${edPending.length > 1 ? "s" : ""}</h2><span class="sub">kept in this browser until saved</span></div>
    <div class="scroll" style="max-height:180px;margin-bottom:10px">${edPending.map((p, i) => `<div style="display:grid;grid-template-columns:1fr auto;gap:10px;font-size: calc(12.5px * var(--fs));padding:5px 0;border-bottom:1px solid var(--line)">
      <span><b>${esc(p.op)}</b> · ${esc(p.table)} · <code>${esc(p.key)}</code>${p.op === "set" ? ` · ${esc(p.field)}: <span style="color:var(--text-3);text-decoration:line-through">${esc(edShow(p.old).slice(0, 60))}</span> → <b>${esc(edShow(p.new).slice(0, 80))}</b>` : ""}</span>
      <button class="btn" data-undo="${i}">Undo</button></div>`).join("")}</div>
    <div style="display:grid;grid-template-columns:200px 1fr auto auto;gap:8px;align-items:start">
      <input id="ed-who" class="ed-input" placeholder="Your name" value="${esc(edEditor)}">
      <textarea id="ed-note" class="ed-input" rows="2" placeholder="Reason / source for these changes (required), e.g. 'Updated from CSR v2' or 'Corrected per ECCO 2026 abstract'"></textarea>
      <button class="btn primary" id="ed-save" ${EDIT_API ? "" : "disabled title='Start scripts/serve.py to save'"}>Save changes</button>
      <button class="btn" id="ed-discard">Discard all</button>
    </div>`;
  host.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => { edPending.splice(+b.dataset.undo, 1); saveDrafts(); render(); });
  document.getElementById("ed-discard").onclick = () => { if (confirm("Discard all unsaved changes?")) { edPending = []; saveDrafts(); render(); } };
  document.getElementById("ed-save").onclick = async () => {
    const who = document.getElementById("ed-who").value.trim(), note = document.getElementById("ed-note").value.trim();
    if (!who || !note) { alert("Please add your name and a reason/source for the changes."); return; }
    try { localStorage.setItem("ibd-editor-name", who); } catch (e) {}
    const btn = document.getElementById("ed-save"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      const res = await fetch("api/overrides", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ops: edPending.map(p => ({ ...p, editor: who, note })) }) });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || res.statusText);

      location.reload();
    } catch (e) { alert("Save failed: " + e.message); btn.disabled = false; btn.textContent = "Save changes"; }
  };
}

async function edHistory(body) {

async function edRebuild() {
