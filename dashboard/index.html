      miss.length ? `No J&J site in: ${miss.map(k => esc(D.country_names[k] || k)).join(", ")}.` : "J&J has sites in all 12 key markets.", `Countries where competitors recruit and J&J does not: ${[...cc].filter(c => !jc.has(c)).map(c => esc(D.country_names[c] || c)).slice(0, 8).join(", ") || "none"}.`] }; },
  competition: () => { const top = (D.competitive_impact || []).filter(i => brandOk(i.jnj_brand_id)).sort((a, b) => b.competitive_threat_index - a.competitive_threat_index)[0];
    return { q: "What are competitors doing, and where does TREMFYA stand?", k: "fcas", pts: [aiH("AI-D01"), top ? `Biggest threat: ${esc(IX.ev[top.event_id]?.description || top.event_id)} (threat ${top.competitive_threat_index}/100).` : "", aiH("AI-001")] }; },
  access: () => { const gls = D.guidelines.filter(g => indOk(g.indication)); const tre = gls.filter(g => (D.guideline_positions || []).some(p => p.guideline_id === g.guideline_id && p.brand_id === "TRE" && p.setting === "overall" && p.position !== "not covered"));
    const miss = gls.filter(g => !tre.includes(g)); const lbl = g => `${esc(g.body.replace(" (living)", ""))} ${esc(g.indication)}`;
    const hta = [...new Set(D.hta_decisions.map(h => h.body))].map(b => `${b}: ${D.hta_decisions.filter(h => h.body === b).map(h => `${h.indication} ${esc(h.decision)}`).join(", ")}`);
    return { q: "How do guidelines and HTA bodies position TREMFYA against competitors?", k: "f", pts: [`TREMFYA is recommended in ${tre.length} of ${gls.length} main guidelines${miss.length ? `; not covered in ${miss.map(lbl).join(", ")}` : ""}.`, `HTA decisions: ${hta.join(" · ")}.`] }; },
  publications: () => ({ q: "How visible is our evidence in journals and at congresses?", k: "fc", pts: [aiH("AI-P01"), aiH("AI-P08"), aiH("AI-P02")] }),
  dissemination: () => { const debt = evidenceDebt().filter(d => brandOk(d.study.brand_ids)); const nextV = D.venues.map(v => [v, pd(v.abstract_deadline)]).filter(([v, d]) => d && d >= TODAY).sort((a, b) => a[1] - b[1])[0];
    return { q: "What are we presenting and publishing next, and what is overdue?", k: "fcs", pts: [`${debt.length} J&J studies have results at congresses but no peer-reviewed paper yet${debt.length ? `: ${debt.slice(0, 4).map(d => `<b>${esc(shortName(d.study))}</b>`).join(", ")}${debt.length > 4 ? "…" : ""}` : ""}.`, nextV ? `Next abstract deadline: ${esc(nextV[0].name)}, ${fmtD(nextV[1])}.` : ""] }; },
  assistants: () => ({ q: "How do ChatGPT and Claude answer patient and HCP questions about IBD drugs?", k: "fca", pts: [aiH("AI-LLM01"), aiH("AI-LLM02")] }),
  field: () => { const byGap = d3.rollups(D.field_insights.filter(f => f.mapped_gap_id && brandOk(IX.gap[f.mapped_gap_id]?.brand_id)), v => d3.sum(v, f => f.frequency_count || 1), f => f.mapped_gap_id).sort((a, b) => b[1] - a[1]);
    return { q: "What are MSLs hearing, and does it match our evidence gaps?", k: "cs", pts: [byGap[0] ? `Most-heard gap: ${cite(byGap[0][0])} (${byGap[0][1]} mentions).` : "", "All field insights are simulated placeholders for CRM data."] }; },
  investment: () => ({ q: "Where does the evidence budget go, and is it good value?", k: "cs", pts: [`${fmtUSD(d3.sum(D.study_funding, f => f.committed_usd))} committed across ${new Set(D.study_funding.map(f => f.study_id)).size} studies.`, "All funding figures are simulated."] }),
};
function sxSummary(explainHtml) {
  const f = SX_SUMMARY[state.view]; if (!f) return explainHtml ? `<div class="explain">${explainHtml}</div>` : "";
  let s; try { s = f(); } catch (e) { return explainHtml ? `<div class="explain">${explainHtml}</div>` : ""; }
  const pts = s.pts.filter(Boolean);
  return `<div class="card sx-sum"><div class="card-h"><h2>In short</h2><span class="provs">${[...s.k].map(c => pvPill(PV_CODE[c])).join("")}</span></div>
    <div class="sx-q">${esc(s.q)}</div><ul>${pts.map(p => `<li>${p}</li>`).join("")}</ul>
    ${explainHtml ? `<details class="sx-how"><summary>How to read this page</summary><div>${explainHtml}</div></details>` : ""}</div>`;
}
// cards shown first on each page; the rest fold under "More on this page"
const SX_KEEP = {
  command: ["Start here", "What matters this week", "Evidence readiness", "Ranked by impact"],
  strategy: ["Strategic imperatives", "Gap map", "Where coverage"],
  scenarios: ["Scenario levers", "Avg readiness", "What this scenario means", "Expected", "Imperative readiness: expected"],
  studies: ["Evidence timeline"],
  lifecycle: ["TREMFYA LOE", "Lifecycle read-out", "When each J&J study can be used"],
  world: ["Countries with J&J", "Trial sites by country", "Footprint by asset"],
  competition: ["Threats to J&J", "Competitor gaps", "Profile vs competitor"],
  access: ["What the guidelines say", "HTA status"],
  publications: ["Publications found", "What the publication record says", "Share of voice by congress"],
  dissemination: ["Upcoming congresses", "Evidence debt"],
  field: ["Field mentions", "What the field is telling us"],
  investment: ["Committed", "Value for money"],
};
function sxFold(el) {
  const keep = SX_KEEP[state.view]; if (!keep) return;
  const grid = el.querySelector(":scope > .grid"); if (!grid) return;
  const kids = [...grid.children]; let keepPrev = true; const move = [];
  let prevKpi = false;
  for (const k of kids) {
    const t = (k.querySelector("h2, .lbl, .section-title")?.textContent || (k.matches(".section-title") ? k.textContent : "") || "").trim();
    const isKpi = !!k.querySelector(".kpi") && !k.querySelector("h2");
    // a row of KPI tiles stays together; untitled blocks follow the block before them
    const isKeep = isKpi && prevKpi ? keepPrev : t ? keep.some(x => t.toLowerCase().startsWith(x.toLowerCase())) : keepPrev;
    if (!isKeep) move.push(k);
    keepPrev = isKeep; prevKpi = isKpi;
  }
  if (!move.length) return;
  // open by default; a section the user closes stays closed on this page until reopened
  const d = document.createElement("details"); d.className = "s-12 sx-more"; d.open = sxState.more[state.view] !== false;
  const n = move.filter(m => m.querySelector("h2, .lbl") || m.matches(".card")).length;
  const cards = `${n} ${n === 1 ? "card" : "cards"}`;
  const label = () => d.open ? `More on this page · ${cards} · click to hide` : `More on this page · ${cards} · click to show`;
  d.innerHTML = `<summary></summary><div class="grid g-12"></div>`;
  const inner = d.querySelector(".grid"); move.forEach(m => inner.appendChild(m));
  d.querySelector("summary").textContent = label();
  d.ontoggle = () => { sxState.more[state.view] = d.open; d.querySelector("summary").textContent = label(); };
  grid.appendChild(d);
}
function sxCommand(el) {
  const grid = el.querySelector(":scope > .grid"); if (!grid) return;
  const Q = [["Which evidence gaps matter most?", "strategy"], ["Will our studies read out in time, before competitors and LOE?", "lifecycle"],
    ["How do guidelines and HTA bodies position TREMFYA vs competitors?", "access"], ["Are we being heard: publications, congresses, AI assistants?", "publications"],
    ["What changes if CHARGE or a competitor study goes the other way?", "scenarios"]];
  grid.insertAdjacentHTML("afterbegin", `<div class="card s-12 sx-start"><div class="card-h"><h2>Start here</h2><span class="sub">five questions this dashboard answers · click one to go to the answer</span></div>
    <div class="sx-qs">${Q.map(([q, v], i) => `<button class="sx-qbtn" data-goto="${v}"><span class="n">${i + 1}</span><span>${esc(q)}</span><i>→</i></button>`).join("")}</div></div>`);
  const ul = el.querySelector(".card.ai ul"); if (ul && !sxState.allBrief) {
    const lis = [...ul.children]; if (lis.length > 3) { lis.slice(3).forEach(li => li.style.display = "none");
      ul.insertAdjacentHTML("afterend", `<button class="btn sx-all" style="margin-top:10px">Show all ${lis.length} points</button>`);
      ul.parentElement.querySelector(".sx-all").onclick = () => { sxState.allBrief = true; render(); }; }
  }
}
function sxTabs(el) {
  const sec = sectionOf(state.view); if (sec[2].length < 2) return;
  el.insertAdjacentHTML("afterbegin", `<div class="sx-tabs">${sec[2].map(v => `<button class="${v === state.view ? "on" : ""}" data-sxtab="${v}">${esc(TAB_LABEL[v])}</button>`).join("")}</div>`);
  el.querySelectorAll("[data-sxtab]").forEach(b => b.onclick = () => { history.pushState(null, "", "#" + b.dataset.sxtab); state.view = b.dataset.sxtab; render(); window.scrollTo(0, 0); });
}
function sxAfterRender(el) {
  if (!SIMPLE) return;
  document.getElementById("view-title").textContent = state.view === "command" ? "Overview" : sectionOf(state.view)[1];
  if (state.view === "command") sxCommand(el);
  sxFold(el);
  sxTabs(el);
  sxNames(el);
}
function sxBuildNav(nav) {
  const acts = buildActions().filter(a => !decisions[a.id]).length;
  for (const [id, label, views] of SECTIONS) {
    const b = document.createElement("button");
    b.className = "nav-btn" + (views.includes(state.view) ? " active" : "");
    b.innerHTML = `<svg viewBox="0 0 24 24">${iconOf(SECTION_ICON[id])}</svg><span class="lbl">${label}</span>${id === "overview" && acts ? `<span class="nav-count">${Math.min(acts, 5)}</span>` : ""}`;
    b.onclick = () => { const v = views[0]; if (state.view !== v) history.pushState(null, "", "#" + v); state.view = v; render(); window.scrollTo(0, 0); };
    nav.appendChild(b);
  }
}
const goAlt = () => { location.href = ALT_URL + "#" + (state.view === "assistants" ? "dissemination" : state.view); };
{
  const fv = document.getElementById("f-version");
  fv.innerHTML = `<button data-v="full" class="${SIMPLE ? "" : "on"}">Full</button><button data-v="simple" class="${SIMPLE ? "on" : ""}">Simplified</button>`;
  fv.querySelectorAll("button").forEach(b => b.onclick = () => { if ((b.dataset.v === "simple") !== SIMPLE) goAlt(); });
}
const altLink = () => `<a href="#" class="sx-alt" onclick="location.href=ALT_URL+'#'+(state.view==='assistants'?'dissemination':state.view);return false">${SIMPLE ? "Switch to the full version" : "Switch to the simplified version"} →</a>`;
if (SIMPLE) {
  // Tester view: provenance labels, (i) buttons and value marks only when switched on
  const prov = document.getElementById("f-prov").closest("label");
  prov.classList.add("tester-only");
  prov.insertAdjacentHTML("beforebegin", `<label class="toggle" title="Show where each number comes from (fact, calculated, AI-inferred, simulated) and how it is calculated"><input type="checkbox" id="f-tester"> Tester view</label>`);
  const tb = document.getElementById("f-tester"); tb.checked = sxState.tester;
  const applyTester = () => { document.body.classList.toggle("clean", !sxState.tester); if (!sxState.tester && state.prov) { document.getElementById("f-prov").click(); } };
  tb.onchange = () => { sxState.tester = tb.checked; try { localStorage.setItem("ibd-tester", tb.checked ? "1" : "0"); } catch (e) {} applyTester(); };
  applyTester();
  new MutationObserver(() => { if (!sxNames.t) sxNames.t = setTimeout(() => { sxNames.t = 0; sxNames(document.getElementById("drawer")); }, 40); })
    .observe(document.getElementById("drawer"), { childList: true, subtree: true });
  let sxT = 0;
  new MutationObserver(() => { if (!sxT) sxT = setTimeout(() => { sxT = 0; sxNames(document.getElementById("content")); }, 60); })
    .observe(document.getElementById("content"), { childList: true, subtree: true });
}

try { const t = localStorage.getItem("ibd-theme"); if (t) document.documentElement.dataset.theme = t; const v = localStorage.getItem("ibd-view"); if (v && RENDER[v]) state.view = v; } catch (e) {}
const hashView = location.hash.slice(1);
if (RENDER[hashView]) state.view = hashView;  // a shared link wins over the last view used here
addEventListener("popstate", () => { const v = location.hash.slice(1); if (RENDER[v] && v !== state.view) { state.view = v; render(); } });
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (RENDER[v] && v !== state.view) { state.view = v; render(); window.scrollTo(0, 0); } });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 200); });
applyView(false);
render();
// confirm the edit API is really there (a plain file server or file:// = read-only)
if (EDIT_API) fetch("api/overrides", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject()).catch(() => {
  EDIT_API = false;
  if (state.view === "editor") render();
});
</script>
